services:

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=sabd-cluster
    env_file:
      - hadoop.env
    volumes:
      - namenode_data:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - hadoop.env
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/hadoop/dfs/data
    depends_on:
      - namenode

  spark-master:
    image: apache/spark:3.5.3
    hostname: spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_HOME=/opt/spark
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./src:/opt/scripts        # ← src è nella stessa cartella del docker-compose
      - ./results:/opt/results

  spark-worker:
    image: apache/spark:3.5.3
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_HOME=/opt/spark
      - PYSPARK_PYTHON=python3
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    volumes:
      - ./src:/opt/scripts
      - ./results:/opt/results

  nifi:
    image: apache/nifi:1.23.2    # ← compatibile con HDFS, prima era 2.4.0
    hostname: nifi
    ports:
      - "9090:9090"             # ← in 1.x è HTTP non HTTPS
    environment:
      - NIFI_WEB_HTTP_PORT=9090  # ← cambia da HTTPS a HTTP
    volumes:
      - nifi_data:/opt/nifi/nifi-current/data
      - nifi_conf:/opt/nifi/nifi-current/conf
      - ./data/flights:/opt/nifi/input
      - ./nifi/hadoop-conf:/opt/nifi/hadoop-conf:ro
    depends_on:
      - namenode
      - datanode

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"


  airflow:
    image: apache/airflow:2.9.0
    hostname: airflow
    user: "0:0"
    ports:
      - "8081:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/start.sh:/opt/airflow/start.sh
      - /var/run/docker.sock:/var/run/docker.sock
      - airflow_data:/opt/airflow
    depends_on:
      - namenode
      - spark-master
      - nifi
    command: bash /opt/airflow/start.sh

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  namenode_data:
  datanode_data:
  nifi_data:
  nifi_conf:
  airflow_data:
  grafana_data: